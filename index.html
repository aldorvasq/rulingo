<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e9" />
    <!-- The app draws its own light and dark themes: «only» stops phones/browsers from force-darkening it. -->
    <meta name="color-scheme" content="only light" />
    <script>
      // Apply the theme before the first paint (no flash): saved choice, or the phone's setting.
      try {
        var s = JSON.parse(localStorage.getItem('rulingo') || '{}').state || {}, st = s.settings || {}
        var mode = st.themeMode || (st.theme === 'dark' ? 'dark' : 'system')
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', dark ? 'only dark' : 'only light')
      } catch (e) {}
    </script>
    <meta name="description" content="Practica ruso con el contenido de Точка Ру A1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ру" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ру · práctica de ruso</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
